<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <linearGradient id="baPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="baSoft"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#0d1117"/>

  <!-- Divider -->
  <line x1="600" y1="60" x2="600" y2="470" stroke="#21262d" stroke-width="1.5"/>

  <!-- ─────────────── LEFT: BEFORE ─────────────── -->
  <text x="300" y="50" text-anchor="middle" fill="#f78166" font-size="22" font-weight="700" letter-spacing="3">BEFORE</text>
  <text x="300" y="78" text-anchor="middle" fill="#8b949e" font-size="13">scattered config — Claude picks whatever it finds first</text>

  <!-- Chaotic scattered config cards (deliberately misaligned) -->
  <g font-size="12">
    <!-- card -->
    <g transform="rotate(-4 175 140)">
      <rect x="95" y="120" width="160" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="110" y="138" fill="#e6edf3">planner.md</text>
      <text x="110" y="153" fill="#6e7681" font-size="10">~/.claude/agents/</text>
    </g>
    <g transform="rotate(3 430 135)">
      <rect x="340" y="115" width="180" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="356" y="133" fill="#e6edf3">planner-actually-good.md</text>
      <text x="356" y="148" fill="#6e7681" font-size="10">written at 2 AM</text>
    </g>
    <g transform="rotate(2 200 205)">
      <rect x="120" y="185" width="170" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="135" y="203" fill="#e6edf3">code-reviewer.md</text>
      <text x="135" y="218" fill="#6e7681" font-size="10">conflicts with tdd-guide</text>
    </g>
    <g transform="rotate(-3 420 215)">
      <rect x="340" y="195" width="160" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="356" y="213" fill="#e6edf3">rules-v2.md</text>
      <text x="356" y="228" fill="#6e7681" font-size="10">contradicts rules.md</text>
    </g>
    <g transform="rotate(4 175 280)">
      <rect x="100" y="260" width="170" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="115" y="278" fill="#e6edf3">/story-authoring</text>
      <text x="115" y="293" fill="#6e7681" font-size="10">.claude/commands/</text>
    </g>
    <g transform="rotate(-2 430 285)">
      <rect x="350" y="265" width="170" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="366" y="283" fill="#e6edf3">session-wrap.md</text>
      <text x="366" y="298" fill="#6e7681" font-size="10">stale — 3 months old</text>
    </g>
    <g transform="rotate(3 230 350)">
      <rect x="160" y="330" width="160" height="40" rx="6" fill="#f78166" fill-opacity="0.08" stroke="#f78166" stroke-width="1" stroke-opacity="0.4"/>
      <text x="175" y="348" fill="#e6edf3">task-breakdown.md</text>
      <text x="175" y="363" fill="#6e7681" font-size="10">which one is current?</text>
    </g>
  </g>

  <!-- tangled connectors -->
  <g stroke="#f78166" stroke-width="1" stroke-opacity="0.18" fill="none">
    <path d="M175,160 C260,180 300,110 430,155"/>
    <path d="M200,225 C300,250 340,180 420,235"/>
    <path d="M175,300 C300,320 360,260 430,305"/>
    <path d="M430,155 C360,220 300,300 230,370"/>
  </g>

  <text x="300" y="420" text-anchor="middle" fill="#f78166" font-size="13" font-weight="600">6 agents · 4 commands · 3 rule files</text>
  <text x="300" y="442" text-anchor="middle" fill="#8b949e" font-size="12">You can't remember which is current. Neither can Claude.</text>

  <!-- ─────────────── RIGHT: AFTER ─────────────── -->
  <text x="900" y="50" text-anchor="middle" fill="#7ee787" font-size="22" font-weight="700" letter-spacing="3">AFTER</text>
  <text x="900" y="78" text-anchor="middle" fill="#8b949e" font-size="13">one opinionated pipeline — nothing to maintain</text>

  <!-- single clean pipeline — one straight glowing spine, ordered top→bottom -->
  <line x1="780" y1="118" x2="780" y2="362" stroke="url(#baPipe)" stroke-width="2.5" filter="url(#baSoft)" opacity="0.4"/>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <g>
      <rect x="710" y="104" width="140" height="32" rx="7" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="780" y="125" fill="#60a5fa">brainstorm</text>
    </g>
    <g>
      <rect x="710" y="152" width="140" height="32" rx="7" fill="#5566f0" fill-opacity="0.15" stroke="#5566f0" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="780" y="173" fill="#818cf8">story</text>
    </g>
    <g>
      <rect x="710" y="200" width="140" height="32" rx="7" fill="#6d4ae0" fill-opacity="0.16" stroke="#6d4ae0" stroke-width="1.2" stroke-opacity="0.55"/>
      <text x="780" y="221" fill="#a78bfa">plan</text>
    </g>
    <g>
      <rect x="710" y="248" width="140" height="32" rx="7" fill="#7c3aed" fill-opacity="0.24" stroke="#7c3aed" stroke-width="1.6" stroke-opacity="0.75"/>
      <text x="780" y="269" fill="#a78bfa">build</text>
    </g>
    <g>
      <rect x="710" y="296" width="140" height="32" rx="7" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="780" y="317" fill="#c4b5fd">review</text>
    </g>
    <g>
      <rect x="710" y="344" width="140" height="32" rx="7" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="780" y="365" fill="#c4b5fd">ship</text>
    </g>
  </g>

  <!-- down arrows between stages -->
  <g stroke="#30363d" stroke-width="1.5" fill="#30363d">
    <line x1="780" y1="136" x2="780" y2="150"/><polygon points="776,150 780,158 784,150"/>
    <line x1="780" y1="184" x2="780" y2="198"/><polygon points="776,198 780,206 784,198"/>
    <line x1="780" y1="232" x2="780" y2="246"/><polygon points="776,246 780,254 784,246"/>
    <line x1="780" y1="280" x2="780" y2="294"/><polygon points="776,294 780,302 784,294"/>
    <line x1="780" y1="328" x2="780" y2="342"/><polygon points="776,342 780,350 784,342"/>
  </g>

  <!-- debug loop under build -->
  <path d="M850,260 C882,256 884,264 884,272 C884,282 868,282 858,278" fill="none" stroke="#f78166" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>
  <polygon points="862,274 855,280 864,282" fill="#f78166" opacity="0.85"/>
  <text x="895" y="276" fill="#f78166" font-size="11" opacity="0.85">debug loop</text>

  <!-- one install box -->
  <rect x="925" y="118" width="255" height="96" rx="10" fill="#7ee787" fill-opacity="0.06" stroke="#7ee787" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1052" y="150" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">10 skills · 5 agents · 1 hook</text>
  <text x="1052" y="174" text-anchor="middle" fill="#8b949e" font-size="12">One to install. One to update.</text>
  <line x1="948" y1="186" x2="1157" y2="186" stroke="#7ee787" stroke-width="0.6" stroke-opacity="0.18"/>
  <text x="1052" y="204" text-anchor="middle" fill="#6e7681" font-size="10.5">plugin install turbocharge@turbocharge</text>

  <text x="1052" y="252" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">One source of truth.</text>
  <text x="1052" y="274" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">Always current.</text>

  <!-- bottom rule -->
  <text x="600" y="500" text-anchor="middle" fill="#484f58" font-size="12">turbocharge — replace scattered config with a single engineering pipeline</text>
</svg>
