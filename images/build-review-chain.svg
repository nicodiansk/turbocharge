<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'SF Mono','Fira Code','Cascadia Code',monospace">
  <defs>
    <linearGradient id="bcSonnet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bcAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d29922"/><stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="bcGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="380" fill="#0d1117"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="95" x2="1200" y2="95" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="380" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="380" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="380" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <text x="600" y="40" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600" letter-spacing="1.5">how build executes each task</text>

  <!-- ═══ ROW 1: DEFAULT ═══ -->
  <rect x="24" y="64" width="1152" height="92" rx="8" fill="#238636" fill-opacity="0.05" stroke="#238636" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="24" y="64" width="5" height="92" rx="3" fill="#3fb950" filter="url(#bcGlow)"/>
  <text x="48" y="92" fill="#7ee787" font-size="13" font-weight="700" letter-spacing="1">DEFAULT</text>
  <text x="48" y="110" fill="#8b949e" font-size="11.5">fast · lean · the common path</text>

  <!-- flow nodes -->
  <g text-anchor="middle" font-size="13">
    <rect x="360" y="92" width="150" height="38" rx="7" fill="#2563eb" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="435" y="111" fill="#e6edf3" font-weight="600">builder</text>
    <text x="435" y="124" fill="#60a5fa" font-size="10">Sonnet</text>

    <rect x="582" y="92" width="150" height="38" rx="7" fill="#2563eb" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="657" y="116" fill="#c9d1d9">self-review</text>

    <rect x="804" y="92" width="150" height="38" rx="7" fill="#238636" fill-opacity="0.14" stroke="#3fb950" stroke-width="1.1" stroke-opacity="0.5"/>
    <text x="879" y="116" fill="#7ee787" font-weight="600">commit</text>
  </g>
  <g stroke="#30363d" stroke-width="1.5" fill="#30363d">
    <line x1="510" y1="111" x2="576" y2="111"/><polygon points="576,107 584,111 576,115"/>
    <line x1="732" y1="111" x2="798" y2="111"/><polygon points="798,107 806,111 798,115"/>
  </g>
  <text x="1095" y="116" text-anchor="middle" fill="#6e7681" font-size="11">1 spawn / task</text>

  <!-- ═══ ROW 2: REVIEWED ═══ -->
  <rect x="24" y="180" width="1152" height="170" rx="8" fill="#d29922" fill-opacity="0.05" stroke="#d29922" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="24" y="180" width="5" height="170" rx="3" fill="url(#bcAmber)" filter="url(#bcGlow)"/>
  <text x="48" y="208" fill="#e3b341" font-size="13" font-weight="700" letter-spacing="0.5">--reviewed</text>
  <text x="48" y="226" fill="#8b949e" font-size="11.5">opt-in for security-</text>
  <text x="48" y="242" fill="#8b949e" font-size="11.5">sensitive or unfamiliar code</text>

  <!-- flow nodes -->
  <g text-anchor="middle" font-size="13">
    <rect x="300" y="232" width="150" height="38" rx="7" fill="#2563eb" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="375" y="251" fill="#e6edf3" font-weight="600">builder</text>
    <text x="375" y="264" fill="#60a5fa" font-size="10">Sonnet</text>

    <rect x="525" y="232" width="170" height="38" rx="7" fill="#2563eb" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="610" y="251" fill="#e6edf3" font-weight="600">task-reviewer</text>
    <text x="610" y="264" fill="#60a5fa" font-size="10">Sonnet · one diff-load</text>

    <rect x="804" y="232" width="150" height="38" rx="7" fill="#238636" fill-opacity="0.14" stroke="#3fb950" stroke-width="1.1" stroke-opacity="0.5"/>
    <text x="879" y="256" fill="#7ee787" font-weight="600">commit</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#30363d" stroke-width="1.5" fill="#30363d">
    <line x1="450" y1="251" x2="519" y2="251"/><polygon points="519,247 527,251 519,255"/>
    <line x1="695" y1="251" x2="798" y2="251"/><polygon points="798,247 806,251 798,255"/>
  </g>
  <!-- verdict label on the pass arrow -->
  <text x="750" y="244" text-anchor="middle" fill="#7ee787" font-size="10">both ✓</text>

  <!-- two verdict pills under task-reviewer -->
  <rect x="525" y="288" width="80" height="24" rx="4" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="0.8" stroke-opacity="0.45"/>
  <text x="565" y="304" text-anchor="middle" fill="#e3b341" font-size="11">Spec verdict</text>
  <rect x="613" y="288" width="120" height="24" rx="4" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-width="0.8" stroke-opacity="0.45"/>
  <text x="673" y="304" text-anchor="middle" fill="#e3b341" font-size="11">Quality verdict</text>

  <!-- loop-back arrow: task-reviewer -> builder when issues -->
  <path d="M525,262 C485,288 420,288 380,268" fill="none" stroke="#f78166" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.8"/>
  <polygon points="373,264 384,267 379,274" fill="#f78166" opacity="0.85"/>
  <text x="448" y="305" text-anchor="middle" fill="#f78166" font-size="10.5" opacity="0.9">issues? → back to builder</text>
  <text x="448" y="320" text-anchor="middle" fill="#6e7681" font-size="9.5">max 2 cycles</text>

  <text x="1095" y="256" text-anchor="middle" fill="#6e7681" font-size="11">2–4 spawns / task</text>
  <text x="1095" y="274" text-anchor="middle" fill="#6e7681" font-size="11">all Sonnet</text>
</svg>
